<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <iframe
    id="player"
    title="Embed player"
    allowfullscreen
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
    referrerpolicy="no-referrer"
  ></iframe>
  <script>
    (function () {
      var ALLOWED_HOST_PARTS = [
        '2embed.',
        'vidsrc.',
        'embed.su',
        'autoembed.',
        'vidsrcme.',
        'youtube.com',
        'youtu.be',
        'youtube-nocookie.com',
        'player.vimeo.com',
        'vimeo.com',
        'drive.google.com',
        'docs.google.com'
      ];

      var player = document.getElementById('player');

      function isAllowed(url) {
        try {
          var host = url.hostname.toLowerCase();
          return ALLOWED_HOST_PARTS.some(function (part) {
            return host === part.replace(/\.$/, '') || host.indexOf(part) !== -1;
          });
        } catch (e) {
          return false;
        }
      }

      function focusPlayer() {
        try {
          player.focus();
        } catch (e) {}
      }

      // Push keyboard into the real embed so Space = play/pause works normally
      player.addEventListener('load', focusPlayer);
      window.addEventListener('focus', function () {
        setTimeout(focusPlayer, 0);
      });
      document.addEventListener('pointerdown', focusPlayer, true);
      document.addEventListener('keydown', function (e) {
        if (document.activeElement !== player) {
          focusPlayer();
          if (e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
          }
        }
      });

      var raw = new URLSearchParams(window.location.search).get('src');
      if (!raw) return;

      try {
        var next = new URL(raw, window.location.href);
        if (next.protocol !== 'http:' && next.protocol !== 'https:') return;
        if (!isAllowed(next)) return;
        player.src = next.href;
      } catch (e) {
        // ignore bad src
      }
    })();
  </script>
</body>
</html>
