name: CI

# Catch a broken build before Vercel or the EC2 box ever sees it
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    name: Build client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

  server:
    name: Check server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Check syntax
        working-directory: server
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      # Loading the routes catches a broken require path or a deleted module,
      # which a syntax check alone would miss. No database connection needed.
      - name: Load routes and models
        working-directory: server
        run: |
          node -e "
            for (const f of ['auth', 'users', 'movies', 'tvshows', 'contacts']) {
              require('./routes/' + f);
              console.log('loaded routes/' + f + '.js');
            }
          "
