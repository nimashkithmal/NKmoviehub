name: Deploy server to EC2

# The client is deployed by Vercel on its own, so this only handles the
# Express API running behind nginx on EC2.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

env:
  APP_DIR: /home/ubuntu/NKmoviehub
  # `pm2 list` on the box shows the app name. "all" restarts every app pm2
  # manages, which is right while this is the only one.
  PM2_APP: all

jobs:
  verify:
    name: Verify server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Check syntax
        working-directory: server
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Load routes and models
        working-directory: server
        run: |
          node -e "
            for (const f of ['auth', 'users', 'movies', 'tvshows', 'contacts']) {
              require('./routes/' + f);
              console.log('loaded routes/' + f + '.js');
            }
          "

  deploy:
    name: Deploy over SSH
    needs: verify
    runs-on: ubuntu-latest

    steps:
      # Without this the job dies inside ssh with an unhelpful error, which is
      # exactly what a missing secret looked like the first time round.
      - name: Check the required secrets are set
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          missing=""
          [ -z "$EC2_HOST" ] && missing="$missing EC2_HOST"
          [ -z "$EC2_USER" ] && missing="$missing EC2_USER"
          [ -z "$SSH_KEY" ]  && missing="$missing EC2_SSH_KEY"

          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            echo ""
            echo "Add them under Settings > Secrets and variables > Actions:"
            echo "  EC2_HOST     the server address, e.g. 51.20.40.2"
            echo "  EC2_USER     the ssh user, e.g. ubuntu"
            echo "  EC2_SSH_KEY  the full contents of your .pem private key"
            exit 1
          fi
          echo "All three secrets are present."

      # Plain ssh rather than a third-party action, so the deploy key is never
      # handed to code outside this repository.
      - name: Pull and restart on EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # A malformed or truncated key otherwise fails later as a bare
          # "Permission denied", which says nothing about the real cause.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "EC2_SSH_KEY is not a usable private key."
            echo "Store the whole .pem file, from the BEGIN line to the END line,"
            echo "with no extra spaces and nothing trimmed."
            exit 1
          fi
          echo "Private key loaded."

          # Not silenced: if the host key cannot be fetched, StrictHostKeyChecking
          # rejects the connection and the reason belongs in the log.
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "Could not fetch the host key from the server."
            exit 1
          fi
          echo "Host key recorded."

          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "$EC2_USER@$EC2_HOST" \
              APP_DIR="$APP_DIR" PM2_APP="$PM2_APP" 'bash -s' <<'REMOTE'
            set -euo pipefail

            # A non-interactive ssh session skips .bashrc, so anything installed
            # through nvm (node, npm, pm2) is not on PATH unless we load it here.
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            export PATH="$PATH:$HOME/.npm-global/bin:/usr/local/bin"

            echo "--- environment ---"
            echo "node: $(command -v node || echo MISSING)"
            echo "npm : $(command -v npm  || echo MISSING)"
            echo "pm2 : $(command -v pm2  || echo MISSING)"

            cd "$APP_DIR"

            echo "--- pulling latest ---"
            git pull origin main

            echo "--- installing dependencies ---"
            cd server
            npm ci

            echo "--- restarting ---"
            pm2 restart "$PM2_APP" --update-env
            pm2 save

            pm2 list
          REMOTE

      - name: Check the API is answering
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://$EC2_HOST/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "API healthy (HTTP $code)"
              exit 0
            fi
            echo "attempt $i: HTTP $code, retrying..."
            sleep 5
          done
          echo "API did not come back healthy"
          exit 1
