name: Deploy server to EC2

# The client is deployed by Vercel on its own, so this only handles the
# Express API running behind nginx on EC2.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

env:
  APP_DIR: /home/ubuntu/NKmoviehub
  # `pm2 list` on the box shows the app name. "all" restarts every app pm2
  # manages, which is right while this is the only one.
  PM2_APP: all

jobs:
  verify:
    name: Verify server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Check syntax
        working-directory: server
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Load routes and models
        working-directory: server
        run: |
          node -e "
            for (const f of ['auth', 'users', 'movies', 'tvshows', 'contacts']) {
              require('./routes/' + f);
              console.log('loaded routes/' + f + '.js');
            }
          "

  deploy:
    name: Deploy over SSH
    needs: verify
    runs-on: ubuntu-latest

    steps:
      # Plain ssh rather than a third-party action, so the deploy key is never
      # handed to code outside this repository.
      - name: Pull and restart on EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              "$EC2_USER@$EC2_HOST" \
              APP_DIR="$APP_DIR" PM2_APP="$PM2_APP" 'bash -s' <<'REMOTE'
            set -euo pipefail
            cd "$APP_DIR"

            echo "--- pulling latest ---"
            git pull origin main

            echo "--- installing dependencies ---"
            cd server
            npm ci

            echo "--- restarting ---"
            pm2 restart "$PM2_APP" --update-env
            pm2 save

            pm2 list
          REMOTE

      - name: Check the API is answering
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://$EC2_HOST/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "API healthy (HTTP $code)"
              exit 0
            fi
            echo "attempt $i: HTTP $code, retrying..."
            sleep 5
          done
          echo "API did not come back healthy"
          exit 1
